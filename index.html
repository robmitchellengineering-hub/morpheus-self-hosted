<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a870971faddba744d9ac7d8/efb9d0d12_generated_image.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a870971faddba744d9ac7d8/efb9d0d12_generated_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(max-width: 768px)" content="#000000" />
    <meta name="theme-color" media="(min-width: 769px)" content="#00ff41" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Morpheus" />
    <link rel="manifest" href="/manifest.json" />
    <title>Morpheus</title>
    <style>
      @keyframes morpheus-spin { to { transform: rotate(360deg); } }
      #morpheus-initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #000; z-index: 9999;
      }
      #morpheus-initial-loader .ring {
        width: 36px; height: 36px; border: 3px solid rgba(0,255,65,0.25);
        border-top-color: #00ff41; border-radius: 50%;
        animation: morpheus-spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body style="background-color: #000000;">
    <div id="root">
      <div id="morpheus-initial-loader"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
