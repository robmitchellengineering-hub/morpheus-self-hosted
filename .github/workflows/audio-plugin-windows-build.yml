# Build the audio-plugin-windows target for real, on a Windows runner.
#
# WHY THIS EXISTS
#
# `audio-plugin-windows` emits VST3 + CLAP + a standalone .exe from one CLAP source, and none of it can be
# built anywhere but Windows: the generated project uses the Visual Studio generator and MSVC, and a plugin
# that fails to load produces no error message at all — it simply never appears in the DAW.
#
# The rest of CI does not cover this. The required checks prove the GUARDS — that the target generates the
# right project and that its steps are the ones a user's workflow would run — on ubuntu, with no MSVC and no
# Windows. The plugin itself is only built when a user compiles, in their own repo. This workflow is the
# cheapest thing that closes that gap: it materialises what the target generates and runs the target's OWN
# steps, so a command changed in the target changes here too.
#
# MANUAL ONLY, DELIBERATELY. Windows runner minutes bill at 2x, and this builds third-party SDKs, so it must
# never run on a pull request or a push. Dispatch it by hand when the target or the shared template changes:
#
#   gh workflow run audio-plugin-windows-build.yml --ref main
#
# It uploads the packaged plugins, so a run can be inspected — and a real plugin loaded in a DAW — rather
# than taken on trust. The macOS route has its own workflow, for the same reason and the same shape.
name: Audio plugin build (Windows)

on:
  workflow_dispatch:
    inputs:
      # ⭐ EMPTY BY DEFAULT, AND THAT IS THE POINT: a normal run is a VERIFICATION and publishes nothing.
      # Set it to a tag to also publish these artifacts as a durable, public download — the demo build
      # linked from the site. Tag `plugin-demo` is the one the site points at.
      publish_tag:
        description: 'Publish the built plugins as a public release under this tag (leave empty to just verify)'
        required: false
        default: ''

permissions:
  # `read` for every step that builds and verifies; `write` is needed by the publish step below, because
  # creating a release is a write to this repository. It is granted at the workflow level because GitHub
  # does not allow a step to raise its own permissions — and the publish step is skipped unless a tag is
  # given, so a verification run still only reads.
  contents: write

jobs:
  audio-plugin-windows:
    name: audio-plugin-windows (all three formats)
    runs-on: windows-latest
    # Configure downloads the VST3 SDK, RtAudio, RtMidi and the Windows Implementation Library, then builds
    # three formats with MSVC. Generous, but a hang must not sit on a runner for an hour.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything else — the wrapper clone, configure, the three builds, the PE/entry-point verification and
      # the packaging — is the target's own step list, executed by this script. See its header for why it
      # does not re-type a single command.
      - name: Build and verify every format the target emits
        run: node scripts/audio-plugin-windows-runner-build.mjs
      # ⭐ WHY THIS RIG NOW BUILDS TWICE, AND WHY THE DEMO WAS WRONG WITHOUT IT. The first build has no model
      # and is the plain gain stage — that is a supported state and the run above still proves it. But the
      # DEMO DOWNLOAD was pointed at that build, so `plugin-windows-*.zip` was a stereo gain stage published
      # under a description calling it "a neural amp model with an input trim, a gate and a three-band tone
      # stack". The build's own proof said otherwise in as many words — "(none: this is the gain plugin)" and
      # one parameter, `Gain`, where the amp has six — and nobody read it. This second build IS the rig, and
      # it is the one published.
      #
      # ⚠️ THE RIG IS COMMITTED, NOT FETCHED, AND THAT IS THE CHANGE. This step used to fetch ONE MIT example
      # model from NeuralAmpModelerCore because no capture could be redistributed. The project owner has since
      # captured his own Marshall JCM 800 2203 in four states through one G12M 4x12 in four mics and owns those
      # files, so all eight live in `assets/demo-rig/` and `--demo-rig` seeds them from the checkout. A
      # download could drift from the manifest; a file in the same commit cannot.
      - name: Build it again WITH the demo rig — this is the one people download
        run: |
          node scripts/audio-plugin-windows-runner-build.mjs --demo-rig
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-windows-nam-build


      # `if-no-files-found: error` is the second half of the check: if a format's zip is missing, the run
      # fails here rather than passing with two of three artifacts.
      - name: Keep the packaged plugins, so the run can be inspected rather than believed
        uses: actions/upload-artifact@v4
        with:
          name: audio-plugin-windows
          path: ${{ runner.temp }}/audio-plugin-windows-build/build/assets/*.zip
          if-no-files-found: error
          retention-days: 7

      # ⭐ AND NOW THE DOWNLOAD ITSELF. The upload above is a 7-day artifact for inspecting a run; it is
      # not a download anyone can be pointed at. This republishes the SAME verified bytes as a release,
      # which is durable, is a real URL, and carries its own notice and proof.
      #
      # It publishes the RIG build — the project owner's four captures through his own four mics. NOT the
      # no-model gain stage above, which is a supported shape but not what the release page describes.
      #
      # `fail_on_unmatched_files` is deliberate. A release missing one of the formats would be a download
      # page promising a VST3 that is not in the archive, which is the exact failure the verify steps
      # above exist to prevent — so the publish fails rather than shipping a partial set.
      # ⚠️ THE PROOF IS RENAMED BEFORE IT IS PUBLISHED, AND THIS IS NOT COSMETIC. Every rig writes a file
      # called BUILD-PROOF.txt and they all publish to the SAME release, so whichever platform ran last
      # overwrote the others — the release briefly carried the Windows proof beside the Linux binaries,
      # which is a download page whose evidence describes a different machine than the file next to it.
      # The zips never collided because they are already named per platform; the proof was not.
      - name: Name the proof for the machine that wrote it
        if: inputs.publish_tag != ''
        run: cp "${{ runner.temp }}/audio-plugin-windows-nam-build/BUILD-PROOF.txt" "${{ runner.temp }}/BUILD-PROOF-windows.txt"

      - name: Publish the demo download
        if: inputs.publish_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: 'Morpheus audio plugin — Windows demo'
          body: |
            A prebuilt Morpheus audio plugin for Windows, so you can hear what the plugin route
            produces before compiling your own. **Read PLUGIN-DEMO-NOTICE.txt first** — it carries the
            terms and the third-party licences.

            This is the whole rig: the project owner's own Marshall JCM 800 2203 captured in four states —
            Crunch, Crunch 2, Hi Gain (TS) and Hi Gain (RAT) — through a Marshall G12M 4x12 in four mics,
            into a drive, a three-band tone stack, a delay and a spring reverb — nine blocks in the order a
            pedalboard would have them. ⚠️ **All four captures and all four cabinets ship with this build.**
            They are the project owner's own captures and are included with it; they are not third-party
            material with a separate licence. **Switch between them with the `Capture` and `Speaker`
            controls in the plugin's own panel, or from the host's parameter list** — they are the last two
            parameters, `Capture` and `Speaker`. **It draws its own control panel** — the plugin owns the
            sliders, so the standalone app has knobs rather than an empty window, and a DAW shows them
            instead of its generic parameter list. Every control is in its own units (dB, %, ms).

            ⚠️ **The standalone monitors your audio input** — with a live microphone and the speakers
            up, an amp model in a monitoring host is a feedback loop and it will howl. Use headphones, or a
            DAW (where the host decides monitoring). And it is a captured high-gain amp: with the gate at its
            lowest setting it has a noise floor of its own, so raise GATE to about -40 dB to silence it
            between notes.
          files: |
            ${{ runner.temp }}/audio-plugin-windows-nam-build/build/assets/*.zip
            ${{ runner.temp }}/BUILD-PROOF-windows.txt
            docs/PLUGIN-DEMO-NOTICE.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
