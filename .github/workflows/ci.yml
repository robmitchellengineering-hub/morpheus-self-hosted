# CI for morpheus-self-hosted.
#
# WHY THIS EXISTS
#
# Until now the only check on a pull request was a Netlify deploy preview — which
# builds the frontend and nothing else. That gap has real consequences:
#
#   * `npm run lint` was RED on main and nobody noticed, because nothing ran it.
#     It broke the verify step AGENTS.md requires and the ship SOP in
#     .dsh/skills/morpheus-dev-protocol.
#   * Self-dev's PRs auto-squash-merge once checks pass (server/src/lib/engine/
#     merge.js). "Checks" meant a deploy preview, so a green preview was the only
#     gate before production.
#
# Deliberately dependency-light: the guards job installs nothing, so it is fast
# and cannot be broken by a flaky registry.
name: CI

on:
  pull_request:
  # Deliberately no `push: branches: [main]`.
  #
  # It existed to catch a merge whose parts were each green on their own but broke
  # main together. Branch protection now requires branches to be up to date, so a
  # pull request is verified against the exact base its squash lands on and that
  # case cannot arise — while the post-merge run re-tested the same tree at full
  # price, about 47% of all runs.
  #
  # What it did NOT cover is a merge made with `--admin`, which bypasses the
  # required checks. workflow_dispatch keeps that on demand instead of paying for
  # it on every merge. After an admin merge, run this workflow from the Actions tab
  # (or `gh workflow run ci.yml --ref main`).
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `prebuild` runs scripts/sync-capabilities.mjs, which rewrites this file
      # (KNOWN-HAZARDS.md H3). A build that dirties it is normal; the warning is
      # here so a change that *commits* it gets noticed.
      - name: Note generated-file churn (H3)
        run: |
          if ! git diff --quiet -- src/MORPHEUS_DESIGN_PLAN.md; then
            echo "::warning file=src/MORPHEUS_DESIGN_PLAN.md::npm run build rewrote this file (hazard H3) — do not commit it unless the change is specifically about it."
          fi

  # REQUIRED as of 2026-09-24: a red render fails the merge gate, not just a look.
  #
  # The gap it closes: every other job here, and both of self-dev's own
  # verification tiers, are blind to whether a page RENDERS. engine/verify.js
  # parses and bundles with esbuild and checks exports; smokeCheckSelfDev probes
  # live URLs over HTTP, and an SPA answers 200 for every path. In one day this
  # repo shipped a dock panel that opened off the bottom of the screen and a
  # guided link that 404'd inside the app's own router — both passed a bundle
  # check AND an HTTP 200. This job serves the BUILT output, opens each public
  # route in real Chrome, and asserts the route reached its destination and
  # rendered a locator naming that page, with a clean console.
  #
  # It landed advisory on 2026-09-23 and was promoted the next day, which is the
  # order that matters: a required gate that has never been seen to fail is not
  # a gate, it is a hope. Both directions are now on the record —
  #
  #   * it PASSES on the real build (three consecutive pull requests);
  #   * it FAILS on a deliberately broken one. Mutation: `: > dist/assets/main-*.js`
  #     (an empty bundle, so the app never boots) → exit 1, "0/5 public routes
  #     rendered", a screenshot per route and a report.json. Run locally with
  #     `npm run build && node scripts/render-smoke.mjs`, which is also how a
  #     red job here gets debugged.
  #
  # What keeps it from becoming a flaky gate, all of it deliberate:
  #
  #   * `timeout-minutes: 10` bounds the job, so a hung browser cannot hold a
  #     runner (and a merge) open indefinitely.
  #   * The browser is the runner's OWN Chrome (`channel: 'chrome'`), not a
  #     download. There is nothing to fetch, so there is no browser-download
  #     step that can be slow, cached wrongly, or flaky — the usual source of
  #     CI browser-test flakes is not present. (That is also why this step has
  #     no `npx playwright install`: nothing needs installing.)
  #   * The app's own API is stubbed ON THE SAME ORIGIN, and every third-party
  #     request is intercepted — so the check never reaches a live service and
  #     cannot pass or fail on the weather.
  #   * Ports are dynamic (`listen(0)`), so two runs can never collide.
  #   * Route locators get 25s, sized for a slower runner and for Landing's
  #     timed boot line — a tight timeout is how a render check becomes flaky.
  #   * On failure the script writes a screenshot per failed route plus
  #     report.json, and the upload step below publishes them — a red required
  #     job nobody can debug is worse than none.
  #
  # To DEMOTE it (a genuine flake that cannot be fixed quickly), remove 'render'
  # from SELF_DEV_REQUIRED_CHECKS in server/src/lib/engine/requiredChecks.js —
  # one array entry, and scripts/verify-merge-gates.mjs asserts the list against
  # the real job names here, so the two can never drift apart silently.
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the backend-generation harness, which runs the ACTUAL generateBackend handler
    # against a database with the AI provider pointed at a fake. This is what makes that path testable
    # for zero credits — the alternative was ~824 credits and an hour per question, which is how three
    # defects got found the expensive way.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morpheus
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The BUILT app, exactly as it ships — not the dev server. `npm run build`
      # rewrites src/MORPHEUS_DESIGN_PLAN.md (H3); that is build noise and is
      # warned about in the `build` job, not repeated here.
      # INSTALLS AND BOOTS a real self-contained app, in the shape the generator is asked to produce,
      # and hits the route that reads from the database. This lives here rather than in the no-install
      # guards job because it needs the network and a real `npm install` — which is the entire point:
      # the first command in a self-contained app's README is what failed on 2026-09-29, and a
      # pre-installed fixture would have proved nothing about it. It exits 2 (not 1) when the registry
      # is unreachable, so a network blip reports NOT VERIFIED instead of a false red.
      - name: A self-contained app still installs, starts and answers
        run: node scripts/smoke-generated-app.mjs

      # server/'s dependencies are installed HERE rather than by the root `npm ci`: there are no npm
      # workspaces, and prisma lives in server/package.json, so the root install leaves server/node_modules
      # absent. That is what made the steps below fail twice — `npx prisma` and then `npm exec -- prisma`
      # each quietly fetched prisma@8.0.0-rc from the registry instead of using a local binary, and v8 has
      # no `push` command. The review harness needs it too: it imports ai.js, which imports jsonrepair.
      - name: Install the server workspace the harnesses run against
        run: cd server && npm install --no-audit --no-fund --no-save

      # The schema has to exist before EITHER harness runs: both go through invokeAI, which reads the
      # role model settings from platform_settings. The review harness ran before this step existed and
      # reported "The table public.platform_settings does not exist" on every settings lookup — noisy,
      # and it meant the run was measuring the no-settings path rather than the real one.
      - name: Apply the schema to the harness database
        env:
          DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
        run: |
          # The LOCAL binary, by path — no registry lookup can substitute a different major version.
          cd server && ./node_modules/.bin/prisma db push --skip-generate --accept-data-loss

      # Files are written as they are produced, replaced rather than deleted first, and the stale sweep
      # runs last — one missing field or one late failure can no longer discard the whole backend.
      - name: A failed generation keeps the work that succeeded
        run: node scripts/verify-incremental-persist.mjs

      # A review is a second opinion; ten of them is not ten times the confidence. Measured 2026-09-30:
      # one backend generation made TWELVE reviewer calls and burned 473 credits with nothing persisted,
      # because nothing bounded the loop and every re-review covered the whole file set again.
      - name: A review cannot run away with a build
        run: node scripts/verify-review-budget.mjs

      # THE ARITHMETIC ABOVE IS NOT THE CLAIM. This runs the REAL reviewAndRetry against a fake that
      # NEVER approves — the adversarial case that made twelve calls in production — and counts the calls
      # on the wire. Needs a database for role settings, hence this job.
      - name: A review that never approves still stops, cheaply
        env:
          DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          REVIEW_HARNESS_USER: ''
        run: node scripts/review-loop-harness.mjs

      # The generator, run for real against the database above with a fake provider answering. Asserts what
      # the MODEL was actually told (read off the wire), what got PERSISTED, and that the two context
      # fixes hold end to end — none of which needs a real model, a key, or a credit.
      #
      - name: The backend generator runs end to end, offline
        env:
          HARNESS_DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
        run: node scripts/backend-generation-harness.mjs

      # A LATER STAGE FAILING MUST NOT ERASE WHAT EARLIER ONES SAVED. With the review rejected, every file
      # the generation produced must still be in the database. Before incremental persistence this case lost
      # all of them — that is how a token-cap truncation, a schema echo and a runaway review each turned
      # into a total write-off of work the operator had already paid ~117-473 credits for.
      - name: A failure after generation keeps what was generated
        env:
          HARNESS_DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          FAKE_FAIL_REVIEW: '1'
        run: node scripts/backend-generation-harness.mjs

      # THE FAILURE THAT COST ~117 CREDITS, reproduced for nothing. With the provider cutting every
      # multi-file ask off at the token cap, the generator must retry each file on its own and still
      # persist the backend. Measured 2026-09-29 on a real run: a chunk returned exactly 24,000 tokens
      # (the step cap), the throw propagated, and because nothing is persisted until the end, FIVE
      # successful model calls were discarded and the project kept only its plan. Remove the recovery and
      # this step does not merely fail — the harness dies on the propagating exception.
      - name: A truncated step no longer discards the whole backend
        env:
          HARNESS_DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          DATABASE_URL: postgresql://morpheus:harness@localhost:5432/harness?schema=public
          FAKE_TRUNCATE_MULTI: '1'
        run: node scripts/backend-generation-harness.mjs

      - name: Build the frontend
        run: npm run build

      # Asserts, per public route: the destination was reached, a locator naming
      # that page is visible, the pre-mount shell is gone, the console is clean,
      # and nothing threw. Exits non-zero naming the route that failed.
      - name: Render every public route in a real browser
        run: node scripts/render-smoke.mjs --out=.render-smoke

      # if: always() — the artifacts are the whole point of a failure, and a
      # step that only runs on failure would leave the passing case with nothing.
      #
      # `include-hidden-files: true` IS LOAD-BEARING: the output directory is
      # `.render-smoke/`, and upload-artifact@v4 SKIPS dot-directories by
      # default. Without this the first run of this job passed and printed
      # "No files were found with the provided path: .render-smoke/" — so on a
      # real failure the screenshots and report.json would have been discarded,
      # which is the exact "red advisory job nobody can debug" outcome the
      # screenshot step exists to prevent. Verified on CI, not assumed: the run
      # after this change uploads the artifact.
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke
          path: .render-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  guards:
    name: guards (no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # META-CHECK, deliberately first: every script below must be loadable
      # WITHOUT an install. verify-billing-clamp.mjs was added here importing
      # through billing.js → db.js → @prisma/client, which passed locally and
      # turned this whole job red (H12's module-load class, one level subtler —
      # every relative import resolved; only a package import failed). This
      # walks the job's own scripts and fails on any reachable package import,
      # so a broken guard is diagnosed before the others run and mask it.
      - name: Guards are install-free
        run: node scripts/verify-guards-no-install.mjs

      # The H9 drift guard's runtime verification — real assertions against the
      # module, not a syntax check. server/src/lib/selfDevDrift.js is pure, so
      # this needs no dependencies.
      - name: Self-dev drift guard (H9)
        run: node scripts/verify-drift.mjs

      # Pure function, no database needed — asserts the brain-dump classifier
      # splits a dictated multi-thought dump into separately-filed items and
      # never loses what was said when the model summarises or drops an item.
      - name: Brain-dump classifier
        run: node scripts/verify-dump-classify.mjs

      # What the dump says afterwards, and what it puts back: a partial failure must
      # not claim the lot nor duplicate what already landed.
      - name: Brain-dump filing outcome
        run: node scripts/verify-dump-filing.mjs

      # The Asteroids reward's economy: the play bank is a ledger (credited seconds minus
      # seconds played) and the board is Morpheus-wide, so an arithmetic slip hands out free
      # play time and the initials rule is the one place a user string faces other accounts.
      - name: Asteroids play bank and board
        run: node scripts/verify-deck-play.mjs

      # The Murbah ledger: a half-typed price must not become NaN or a coerced 0, and an all-day
      # Calendar event ends EXCLUSIVELY while the booking range is inclusive — an off-by-one there
      # shifts every booking by a day, silently.
      - name: Murbah ledger money and range
        run: node scripts/verify-murbah-money.mjs

      # Life-stream attachments: is_image decides a thumbnail vs a document icon, and the wrong way
      # round shows a broken image where a plain icon would have done.
      - name: Life-stream attachments
        run: node scripts/verify-life-files.mjs

      # Jarvis's voice: the prompt constraints that keep replies speakable (dropped once already, and a
      # prompt is prose — nothing fails when a rule disappears), and the 1.3x butler playback.
      - name: Jarvis voice and playback
        run: node scripts/verify-jarvis-voice.mjs

      # The career register: the 36 names are the only copy (the persona renders them), every brief
      # stays a shorthand inside its size budget, the selector cannot invent a career or overrun its
      # cap, and the jurisdictional grounding is never silent. All of those fail quietly otherwise —
      # a prompt is prose and a list is exactly what an edit trims unnoticed.
      - name: Jarvis careers, briefs and grounding
        run: node scripts/verify-jarvis-careers.mjs

      # Our own web search: the ad filtering, the host dedupe, the official-source preference and the
      # cache freshness — plus the wiring that puts it ahead of Wikipedia and reads the top page.
      - name: Our own web search
        run: node scripts/verify-web-research.mjs

      # The snapshot gate on every Jarvis message: only an explicit classifier false may drop the
      # ~2,400-token Deck snapshot (a failed check must INCLUDE it — answering blind is the dangerous
      # direction), the persona must never claim a snapshot it was not given, every capped list must
      # say it is capped while a complete one must not, and the manual synthesis must be bounded by
      # its schema and store nothing when the model was cut off.
      - name: Jarvis snapshot gate and honest prompts
        run: node scripts/verify-jarvis-snapshot-gate.mjs

      # How long Jarvis's reply is allowed to be, and how it is bounded: a quick question got a
      # 743-token (~550-word) answer in 9.0s against a persona that says "one to four sentences".
      # The fix is the reply's SHAPE — an explicit role, a { reply: string } schema, one bounded
      # repair pass — NOT a smaller MAX_REPLY_TOKENS (that turns verbosity into OUTPUT_TRUNCATED,
      # H6). Asserts the overshoot boundary exactly, that a failed/truncated/junk repair keeps the
      # ORIGINAL reply, that an empty reply is still refused, and that an explicit report, plan or
      # breakdown request still gets its long answer.
      - name: Jarvis reply length is bounded by its shape
        run: node scripts/verify-jarvis-reply-length.mjs

      # Rob: "it doesnt look like its doing anything ... i want to see it earlier and being written
      # if it can start reading behind the streamed output even better". Asserts the opt-in rule that
      # keeps every existing caller byte-identical (a `stream: true` body field, never the Accept
      # header), the SSE framing of a provider stream and of the { reply: string } envelope the
      # length fix made the reply, EVERY failure falling back to the blocking call rather than
      # storing a fragment, that both transports still store the same text through the same repair
      # pass, and the sentence boundary streaming speech is allowed to speak on.
      - name: Jarvis streams its reply, and speaks behind it
        run: node scripts/verify-jarvis-stream.mjs

      # Exporting a reply: the filename must survive a downloads folder, a comma inside a cell must not
      # split the columns, and only a real table should offer a spreadsheet.
      - name: Document export
        run: node scripts/verify-doc-export.mjs

      # The Deck's long-term memory fold: a valid answer with no memory text must
      # not mark a batch of turns as folded, which would drop them from memory
      # permanently and without a word.
      - name: Deck memory fold
        run: node scripts/verify-deck-memory.mjs

      # The Gmail inquiry sync's two hard edges: it must stop inside the browser's own
      # request timeout, and it must not file the same email twice when its seen-marker
      # write fails.
      - name: Gmail sync limits
        run: node scripts/verify-gmail-sync.mjs

      # A widget build runs ~15 minutes in the server process and then merges a PR that
      # redeploys production — replacing the process running it. This asserts the durable
      # work (install the widget, reach a terminal status) happens BEFORE the post-deploy
      # wait, and that a row which stops reporting is resolved instead of freezing the bar.
      - name: Deck widget build survives its own deploy
        run: node scripts/verify-deck-widget-build.mjs

      # Rob, 2026-10-04: brain dump is locked to the top of the Command Deck and everything else moves.
      # A new user's first widget was Jarvis's suggestions, because the registry order is what seeding
      # numbers from — this asserts the pin, the move that cannot pass it, and that all four surfaces
      # (registry, deck, context, settings) go through the one rule.
      - name: Brain dump is pinned to the top of the deck
        run: node scripts/verify-deck-widget-order.mjs

      # A widget build may create a backend endpoint at server/src/functions/widget<PascalCase>.js, and a
      # file there is routed JUST BY EXISTING — no registry to remove. Deleting the widget used to leave it
      # behind: live, reachable, answering 401 instead of 404. That happened (#439 left widgetEnergySparkline
      # behind, removed by hand in 1a1922b). This asserts every widget endpoint is invoked by a widget, that
      # the delete path removes the widget's own (and never a shared) endpoint, and that the path is admitted
      # to the scoped push — asserted against the real incident as a fixture, not against its own prose.
      - name: A deleted widget takes its backend endpoint with it
        run: node scripts/verify-deck-widget-backend.mjs

      # The signed-in surface is rendered by NO other gate: every protected route is behind
      # ProtectedRoute, so the `render` job below — which has no session — never fetches those chunks.
      # `#502` put a blank /deck/settings through a fully green pipeline that way (H22). The render
      # check itself needs Postgres and a browser and cannot run here; this asserts it exists, that its
      # safety interlocks are intact, and that it is documented where the next person will look.
      - name: The logged-in render check exists and is safe to run
        run: node scripts/verify-render-check.mjs

      # One CLAP source in, VST3 + AU + standalone + CLAP out. This target GENERATES the project as
      # well as building it, so the guard checks the generated C++/CMake for the settings that are not
      # optional, and the build steps for the decisions a spike had to pay for — most importantly that
      # the verification looks INSIDE each bundle, because a bundle directory with no binary in it
      # uploads, downloads and fails to load with nothing saying so.
      - name: The audio-plugin target generates a project that builds
        run: node scripts/verify-audio-plugin.mjs

      # The APP side of the same document, and the failure it catches is invisible above: a corrupt `.nam` is
      # KEPT by the resolver (so its warning can surface) and DROPPED by the emitter — so an app that listed
      # the manifest would offer a member the plugin does not play. Also that a save cannot be silently
      # shortened, that the manifest writer edits the user's file rather than regenerating it, and that the
      # board editor and the plugin draw one signal path.
      - name: The rig is one document, read the same way by the app and the plugin
        run: node scripts/verify-rig.mjs

      # The measurement library: every assertion is a signal whose answer is known independently (a coherent
      # sine's FFT peak is N/2; a pure sine's THD is zero; 8-bit SQNR is 6.02N + 1.76). It is the engine the
      # plugin test bench, the capture rig and the quantization playground all stand on, so it is checked on
      # every pull request rather than when someone remembers.
      - name: Audio measurement library
        run: node scripts/verify-audio-measure.mjs

      # The .nam quantizer and the deployment container: pure arithmetic and pure format, so it needs no
      # engine, no model and no network — which is why it can live in the no-install guards job.
      - name: NAM quantization and the deployment format
        run: node scripts/verify-nam-quantize.mjs

      # The capture pre-flight: what NAM's own trainer will accept, transcribed from its source. It needs no
      # engine, no model and no network either — the official input is identified by MD5, and everything else
      # is arithmetic on a synthetic capture — so it belongs in this job beside the quantizer.
      - name: Capture pre-flight agrees with NAM's trainer
        run: node scripts/verify-audio-capture.mjs

      # The portable download used to be a hand-run mirror that shipped a tree a month out of
      # date. This asserts it is generated during the build, selects the real product, and says
      # what it does NOT contain.
      - name: Portable bundle is generated from the code it ships
        run: node scripts/verify-portable-bundle.mjs

      # The installer has to finish the job on someone else's machine: real secrets, a database it
      # delegates rather than re-implements, and an honest list of what it still does not do.
      - name: Portable installer holds up its end
        run: node scripts/verify-portable-setup.mjs

      # Remote access asks a stranger to expose a machine: it must not install a VPN, must not
      # funnel to the open internet, and must not guess a CLI syntax that has changed across versions.
      - name: Portable remote access holds up its end
        run: node scripts/verify-portable-remote.mjs

      # Where a local install's AI comes from decides whether the operator's code stays on their
      # machine, so the three sources, their costs and their privacy consequences are asserted —
      # including the paid default that is decided but cannot work until the broker is deployed.
      - name: Portable AI source holds up its end
        run: node scripts/verify-portable-ai.mjs

      # The install has to work on a machine that is not this one. Two spawn calls in it were broken
      # on Windows only and broken several steps in — unreachable from a Mac, so what is asserted here
      # is the platform DECISION, exercised for win32/linux/darwin on any host.
      - name: The installer works on all three platforms
        run: node scripts/verify-portable-platform.mjs

      # The operator's whole-stack choice, which is what decides whether what they build is something
      # they can run without anyone's account. A posture is a COMPLETE stack, and a self-contained one
      # must arrive with a single command to start it.
      - name: An operator can run what they built
        run: node scripts/verify-delivery-posture.mjs

      # A backend is generated a few files per call, so a later chunk used to be written blind to what the
      # earlier ones produced — measured 2026-09-29 as a backend whose files held three different beliefs
      # about what `db` was. This asserts the mechanism that makes them visible to each other.
      - name: Backend files are generated able to agree with each other
        run: node scripts/verify-backend-chunk-context.mjs

      # Would the app we hand the operator actually run? Two defects were measured on 2026-09-29 by
      # generating a self-hosted app and running it: a dependency with no prebuilt binary for this Node,
      # and a module contract that could not hold. verify-server-imports cannot see either — it checks
      # that imports RESOLVE, not that the shape a module receives is the shape it uses.
      - name: The app we generate is one that runs
        run: node scripts/verify-generated-app.mjs

      # "It ships" is only good news if it ships SAFE. ~45% of AI-generated code fails security tests and
      # ~380,000 AI-built apps sit publicly accessible, so the artifact is examined rather than trusted: a
      # shipped .env, a hardcoded key, data routes with no auth in front of them. The checks are REPORTED,
      # not enforced — blocking on them would be a policy decision nobody has made — so what is asserted
      # here is that they run on both generating paths and that a clean report never claims an audit.
      - name: A generated app arrives with its dangers named
        run: node scripts/verify-security-posture.mjs

      # Security is the first posture; this is the second, with the opposite failure mode. An app that
      # never shows a busy state, swallows a failure with nothing on screen and clears the form on the way
      # out is not dangerous — it is untrustworthy, and it raises no error anywhere. The ten rules are given
      # to the planner and the coder, the six mechanically detectable ones are checked over the generated
      # files, the result is REPORTED and never enforced, and a non-UI app is reported as NOT EXAMINED
      # rather than clean. What is asserted here is that every check can fire, that comments and string
      # literals cannot satisfy one, and that both generating paths tell the model and report the result.
      - name: A generated app is asked to show its work
        run: node scripts/verify-ui-feedback.mjs

      # Every builder in this category exports SOURCE and leaves the user with a pile of files; the
      # market's complaint is that they cannot get to a RUNNING system. Morpheus made it worse: the export
      # invented a package.json (`start: node index.js`) and a README (`npm install && npm start`) when the
      # project lacked them, so a zip that could not run looked like one that could — and for a Python,
      # static or compiled target the invented Node manifest was simply false. Asserted here: the export
      # adds nothing, and it names the command that starts each part or says what is missing.
      - name: A downloaded app keeps the promise on the button
        run: node scripts/verify-export-promise.mjs

      # The frontend stopped deploying on 2026-09-30 and NOTHING in this repo could see it: the compile
      # succeeded, the deploy failed, and no Netlify status reached the merge commit. `VITE_` variables are
      # inlined into the client bundle BY DESIGN, so `netlify.toml` omits those keys from the secrets scanner
      # by name. This asserts that list and the code cannot drift apart, that the scanner is NOT switched off,
      # and that no secret-shaped variable is ever inlined — omitting a key is a claim its value is public,
      # and a claim needs a check.
      - name: A new client variable cannot silently stop the frontend deploying
        run: node scripts/verify-client-env.mjs

      # AND THE THING THAT ACTUALLY RAN OUT TWICE. Every push builds: a deploy preview for a branch and a
      # production deploy for main. morpheus.nz answered 503 usage_exceeded on every path on 2026-10-01, and
      # again on 2026-10-05 after a day of five pull requests and a few rebases — about thirteen full builds.
      # `netlify.toml` now skips deploy previews by reading the deploy CONTEXT, which cannot skip production,
      # and this asserts the rule exists, that it keys on the context rather than on paths (the stale-site
      # trap that file already warns about), and that the incident record stays next to it.
      - name: The site is not rebuilt for every pull request
        run: node scripts/verify-netlify-cost.mjs

      # Morpheus is PUBLISHED source, not open source (Rob, 2026-10-05: "lets not grant those rights"). That
      # posture is carried entirely by a LICENSE file and four `license` fields — nothing breaks when they go.
      # And it had already gone wrong the other way: two manifests declared "license": "MIT", an active grant
      # of exactly the rights the notice withholds, in the files a tool reads first.
      - name: The repository states its own terms, and no manifest contradicts them
        run: node scripts/verify-license-terms.mjs

      # THE ACTUAL CAUSE of that outage, and it was a test fixture. `verify-security-posture.mjs` needed a
      # hardcoded-secret fixture and used a Stripe-shaped `sk-live-…` string; smart detection scans REPOSITORY
      # CODE, so from the moment that guard landed the deploy was refused while the build passed. Netlify's
      # error template blamed the `VITE_` variables and offered to omit keys, which could not have worked —
      # the flagged string was not an environment value at all. A fixture is committed code and must never be
      # shaped like the thing it tests for; this fails the build if any tracked file grows one again.
      - name: No committed fixture looks like a credential
        run: node scripts/verify-no-secret-fixtures.mjs

      # H19: "before believing a green check, break its subject and confirm the check goes red. A guard whose
      # failure cannot be demonstrated is a comment with a console.log." This repo has 86 guards and, until
      # now, none of them proved it could fail — which cost real time twice in one day, once when a guard was
      # found to REQUIRE the bug it existed to prevent, and once when a guard's own fixture could never
      # satisfy its assertion, so no mutation of the subject would have found it.
      #
      # Both halves run here. The registry integrity guard is cheap and side-effect free: completeness, no
      # stale or ambiguous `find`, and a ratchet that makes a new UNPROVEN guard impossible to add quietly.
      # A FRESH self-host came up missing seventeen columns and said nothing. `manual-supabase-init.sql` is
      # the bootstrap for a new install, and the selfdev-* migrations were applied to production and never
      # mirrored into it: synced_sha, the CRM fields (#383), the fee tiers (#394) and the usage-event
      # observability columns. Nothing broke loudly — readers fall back to the pre-migration shape, so the
      # features simply did not persist on a fresh install, which is why it went unnoticed.
      - name: A fresh self-host gets the migrated schema
        run: node scripts/verify-bootstrap-sql.mjs
      # Defect 9, from the first real end-to-end backend run: the plan asked for
      # `migrations/001_initial.sql`, the generator wrote `migrations/0001_init.sql`, and the completeness
      # check — a literal set difference — reported a file that EXISTS as missing. A false "missing" is
      # worse than none, because it teaches the operator to ignore the flag.
      - name: A planned file that was renamed is not reported missing
        run: node scripts/verify-plan-reconciliation.mjs

      # Defect 4: `appliedOps` is a MIXED list — real writes beside refusals, skips and failures — and
      # `appliedOps.length` decided NINE things, so a turn where every operation was refused still triggered
      # the GitHub auto-sync, ran the polish pass, was billed as `chat_build`, and told the workspace which
      # files had changed. One definition now, published in the payload as `changedPaths`.
      - name: A refused operation does not read as a change
        run: node scripts/verify-applied-ops.mjs

      # A desktop app built green on four platforms, downloaded, and died on first launch because
      # PyInstaller collected a Qt framework twice — and no build machine could have caught it. The machine
      # that RUNS the app is the only one that can test it, so a generated app must be drivable headlessly
      # and must report a readable result. This guard WRITES the generated runner beside a real little app
      # and RUNS it, for the reason the app just taught us: reading a runner proves nothing about a runner.
      - name: An app can be tested on the machine it is installed on
        run: node scripts/verify-app-selftest.mjs

      # A compile of a REAL app failed on both macOS jobs inside Morpheus's OWN generated workflow: the
      # Release step published USER-MANUAL.txt, which the renderer writes in BEFORE actions/checkout@v4,
      # and the checkout cleans the workspace and deletes it. The diagnosis loop could not fix that and
      # should not have tried — it writes to the construct's files while Morpheus regenerates the workflow
      # every compile — yet it spent a full 32,000-token call (40,365 in, OUTPUT_TRUNCATED, recorded
      # `status: ok`) on it. This guard drives the owner classifier that stops that, and proves the rule
      # that matters most: only a confident, evidence-backed 'morpheus' verdict skips the AI fix path.
      # 'app', 'credentials' and 'unknown' keep today's behaviour, because the build pipeline must stay as
      # free as possible. A miss is acceptable; a false "this is Morpheus's fault" that stops a real fix is not.
      - name: A Morpheus-owned build failure is not sent to the app
        run: node scripts/verify-build-failure-owner.mjs

      # compileProject pushes the construct's files one way to GitHub before every build, so anything that
      # edited the repo directly is silently overwritten by the next compile — and the fix loop was spending
      # on constructs in exactly that state. This guard pins the content-based divergence check (never a
      # timestamp), the exclusion of Morpheus's own generated files (`_compiled/*`, the rendered workflow),
      # the exact warning copy, and the rule that matters most: 'unknown' and 'in-sync' change NOTHING about
      # today's behaviour, so a check that cannot answer never blocks a build or a fix (H17).
      - name: Divergence from the repo is detected, warned about, never blocks
        run: node scripts/verify-project-divergence.mjs

      - name: The guard-mutation registry is honest
        run: node scripts/verify-guard-mutations.mjs

      # And the proof itself: one sabotage per guard, applied to a real file, with the guard expected to go
      # red — then restored byte-for-byte and hash-verified. ~6 seconds for the whole set. It fails on a guard
      # that SURVIVES (a check that cannot fail), a STALE mutation (one that no longer matches, reported
      # rather than skipped), or a guard that was already red before the sabotage.
      - name: Every registered guard fails when its subject breaks
        run: node scripts/mutate-guards.mjs

      # There are TWO copies of the infrastructure registry and nothing kept them in step. That already
      # cost the posture feature its entire UI once, because BackendPanel.jsx imports the copy the work
      # had not touched — and every guard passed. This compares them as DATA, by asking both the same
      # questions, because comparing their text would be defeated by the annotations that legitimately
      # differ between a .ts and a .js file.
      - name: The two registry copies are one registry
        run: node scripts/verify-registry-parity.mjs

      # A failed ADVISORY check must not throw away a build the user already paid for. Both directions
      # are asserted: the coder's work survives a reviewer that throws, and the failure can never read
      # as a pass.
      - name: A failed AI gate does not cost the user their build
        run: node scripts/verify-build-gate-failopen.mjs

      # The paid default is only paid if a brokered call actually reserves, charges and records. This
      # asserts the money paths: the reservation instead of a balance check, the flat rate instead of a
      # per-token price, the refusal of streaming, and the field names the two services share.
      - name: Brokered AI calls are metered, not merely described
        run: node scripts/verify-cloud-metering.mjs

      # The metered gateway needs a token per ACCOUNT, so /api/broker/token accepts a caller that is
      # not a user session. This asserts who may mint for whom — the one conditional standing between
      # "the install serves its own operator" and "anyone can mint a token for anybody".
      - name: Only the right caller can mint a gateway token
        run: node scripts/verify-broker-minting.mjs

      # A launcher's two lies: opening the browser before the server answers, and reporting "stopped"
      # while it is still running. Both are asserted, along with the exec bit that makes it clickable.
      - name: Portable launcher holds up its end
        run: node scripts/verify-portable-launcher.mjs

      # The inbox reply draft's failure path: an empty draft must not read as success, and
      # a failure must not be reported as a save error.
      - name: Reply draft failure
        run: node scripts/verify-deck-draft.mjs

      # A failed Google-Doc fill must not leave an empty document in the operator's own
      # Drive, which nothing ever cleaned up.
      - name: Deck document cleanup
        run: node scripts/verify-deck-document.mjs

      # What the Jarvis snapshot fetches versus what it renders: an unbounded fetch in the
      # prompt path costs tokens proportional to the operator's whole history.
      - name: Deck snapshot bounds
        run: node scripts/verify-deck-snapshot.mjs

      # The CRM columns were readable before they were writable, so the rows could not be filled in.
      # This pins the write path, the one-place derivation of the commission, and the two honesty
      # rules around it (a date is not a Date object; a missing price does not print as $0).
      - name: Deck CRM edit path
        run: node scripts/verify-deck-crm-edit.mjs

      # The consignment fee stopped being a hardcoded 30/2000/20 rule and became per-account
      # settings. This pins the one derivation, the preserved default, the setting actually
      # reaching it, the display label no longer being hardcoded, stored fees never being
      # recomputed, the additive migration, and the H11 fallback that keeps an unapplied column
      # from taking the whole Deck down.
      - name: Deck fee tiers
        run: node scripts/verify-deck-fee-tiers.mjs

      # Rob could press Add twice in repairs and get two jobs: state is not visible to a second
      # press in the same tick, so only a ref stops it, and only a sentence stops a greyed-out
      # control reading as a dead one.
      - name: Deck add guard
        run: node scripts/verify-deck-add-guard.mjs

      # A truncated LIST is not a truncated answer: the items already written are complete, and the
      # classifier that splits a brain dump must not be destroyed by the reasoning tax.
      - name: Truncated-JSON salvage
        run: node scripts/verify-salvage-json.mjs

      # An expired Google credential must never be handed out as if it worked: three modules used
      # to fall through with a token they had just failed to renew, and the operator got Google's
      # OAuth text instead of the one action that fixes it.
      - name: Google reconnect
        run: node scripts/verify-google-reconnect.mjs

      # A capability nobody can find is not a capability, and a control row that runs off a phone
      # tile is not a layout bug worth rediscovering: both are pinned by name.
      - name: Deck UI reach and fit
        run: node scripts/verify-deck-ui.mjs

      # A page left open across a deploy holds chunk names the CDN has replaced; that reads as a
      # crash. It must recover itself once, and never loop on a genuine failure.
      - name: Stale-deploy chunk recovery
        run: node scripts/verify-stale-chunk.mjs

      # A file that matches no ESLint config block is not clean, it is UNCHECKED. This repo has now
      # had that gap four times, including src/main.jsx and src/App.jsx.
      - name: Lint coverage
        run: node scripts/verify-lint-coverage.mjs

      # The "make a website" on-ramp: web-app leads every compile-target list and is worded as a
      # website, the three dialogs render from ONE list instead of drifting, and the website button
      # says WordPress and the plugin. Rob asked for both on 2026-09-28.
      - name: The website on-ramp is honest and undrifted
        run: node scripts/verify-onramp.mjs

      # The task families: the registry is data a builder can use, and the COLLECT pre-flight refuses the
      # things that cannot be trained on — with the right reason each time. The one that matters is the leak:
      # the same audio on both sides of a split, which reports a GOOD number and is worth nothing.
      - name: A dataset is judged before it costs a GPU hour
        run: node scripts/verify-task-models.mjs

      # VERIFY and PACK: a container's claim has to be reproducible from the container, and a bit width has to be
      # a measurement. The check that matters most is the front-end probe — a runtime whose window, padding or hop
      # has drifted from the training project still classifies the test set perfectly, and this is the only thing
      # that sees it. The last section emits the C, COMPILES IT and compares its scores against the reader.
      - name: A model is verified against its own evidence
        run: node scripts/verify-task-ladder.mjs

      # The price and the meter must agree: the exemption rule is tested behaviourally, and no
      # customer-facing file may promise a free own-key path the billing code does not honour.
      - name: AI cost claims match the meter
        run: node scripts/verify-ai-cost-claims.mjs

      # The billing ledger's ARITHMETIC, on every pull request (its database half needs production
      # credentials, so it runs in verify.mjs and never in CI). Real measured production figures are
      # the fixtures, so this proves the formula agrees with the meter that actually ran.
      - name: The billing ledger reconciles (arithmetic)
        run: node scripts/verify-billing-ledger-math.mjs

      # A GitHub token that has expired and cannot be refreshed must be REPORTED, not handed to a
      # compile that will fail wearing GitHub's own 401 — the defect fixed for Google the same day.
      - name: A dead GitHub credential is reported, not tried
        run: node scripts/verify-github-reconnect.mjs

      # The construct list must be findable, and its empty state must say WHAT it searched —
      # name-only matching is how Rob concluded his construct was gone (2026-09-28).
      - name: The construct list is findable
        run: node scripts/verify-workspace-search.mjs

      # An endpoint that fetched a caller-supplied URL and reported its status was an open SSRF
      # probe oracle, and it resolved another user's deployed URL from a bare projectId.
      - name: Deploy health is owner-scoped
        run: node scripts/verify-deploy-health-scope.mjs

      # "Take it live" publishes a built web app into the customer's OWN Netlify account with
      # the customer's OWN token. This pins the ethos (no platform fallback token, no Morpheus
      # account), the owner-scoped 404, that only the compiled ZIP is deployed and never
      # backend/ source, the deploy record that makes "live at <url>" and re-deploy work, and
      # the pending state that disables the control while it runs.
      - name: Frontend deploy stays on the customer's connection
        run: node scripts/verify-frontend-deploy.mjs

      # Provider credentials were stored as plain JSON while the schema and the UI both promised
      # "encrypted at rest". Behavioural checks on the helper, plus a tree walk for a raw reader.
      - name: Connections are encrypted at rest
        run: node scripts/verify-connection-secrets.mjs

      # Bounding the two prompt blocks that could grow without limit, without losing the
      # signal: the last exchange stays verbatim and any omission is named.
      - name: Deck prompt bounds
        run: node scripts/verify-deck-prompt-bounds.mjs

      # Usage events must record which call, whether it succeeded, and how long it took — the
      # platform could answer none of those before 2026-09-27.
      - name: Usage observability
        run: node scripts/verify-usage-observability.mjs

      # The proactive-insight opt-out gate, plus the cross-boundary contract
      # that the widget it keys off still exists in the frontend registry with
      # the copy that makes the control discoverable.
      - name: Proactive-insight opt-out
        run: node scripts/verify-insight-optout.mjs

      # The rules that decide what AI-written SEO is allowed to write onto a
      # live site (length, no fabricated facts, no script), plus the
      # cross-language contract between the JS payload and the WordPress
      # plugin's own PHP input map — a rename on either side is a silent no-op
      # at runtime, since the plugin ignores keys it does not know.
      - name: SEO generation rules + plugin contract
        run: node scripts/verify-seo.mjs

      # The WordPress pairing flow: the code is a credential that mints the
      # shared secret, so the security rules (constant-time compare, expiry,
      # single use, failure and rate limits, no look-alike characters) and the
      # JS/PHP wire contract are asserted rather than assumed — a rename on
      # either side is a silent 403 at runtime.
      - name: WordPress pairing rules + plugin contract
        run: node scripts/verify-pairing.mjs

      # Putting a live site into a repo: the export endpoint reads files off
      # someone's server, so "inside the active theme only, text only, capped,
      # and everything skipped is reported" is asserted against the source, as
      # is the JS/PHP contract for it.
      - name: Site working copy rules + plugin contract
        run: node scripts/verify-working-copy.mjs

      # Keyword research: the autocomplete payload and competitor-page parsing,
      # plus the rule that makes the feature honest — every keyword carries the
      # signal that produced it, and the response has nowhere to put a search
      # volume or difficulty score (a model asked for one invents it).
      - name: Keyword research rules
        run: node scripts/verify-keywords.mjs

      # The theme's own readability rule: body-copy tokens must clear WCAG AA.
      - name: contrast
        run: node scripts/verify-contrast.mjs

      # The green/ink convention the tokens cannot express: the brand green marks
      # titles, labels, badges and actions, and ink carries the prose. Asserted
      # from BOTH sides — prose that is still green fails, and so does a sweep
      # that stripped the green off the titles, because the brand is the point.
      - name: prose-ink rule
        run: node scripts/verify-prose-ink.mjs

      # The photo widget on Alice Stats: what counts as a Drive folder, what
      # counts as an acceptable photo, and above all that a 403 (this connection
      # cannot write there) never reads like a 404 (no such folder) — plus the
      # promises on screen: the photo goes to the user's own Drive, the camera
      # opens on a phone, and no Prisma column was added for what an existing
      # JSON column already holds.
      - name: Photo widget rules
        run: node scripts/verify-photo-drive.mjs

      # Per-app capability grants: a user's one-time approval that ONE generated
      # app may use ONE capability against the user's OWN Google Drive connection.
      # The checks that matter are behavioural and driven with plain objects: a
      # token for app A cannot act for app B, a revoked grant is inert, and the
      # endpoint takes a grant and never a Morpheus session. Plus the honesty half —
      # a static app is told to bring its own OAuth client, with the steps, because
      # a token that can write to a Drive must never ship in a public page.
      - name: App capability grants
        run: node scripts/verify-app-capability-creds.mjs

      # Traffic (IndexNow): the pure payload/batching/ledger decisions, the rule
      # that a 2xx means "submitted" and never "indexed", and the contracts across
      # the boundary — the action list against the plugin's switch, the widget
      # scope against what the tab actually invokes, the caps on both sides, and
      # the tab being mounted by BOTH surfaces. Each of those otherwise fails at
      # runtime on a customer's site as a silent 400 or a missing tab.
      - name: Traffic rules
        run: node scripts/verify-traffic.mjs

      # The dock: the button the site prints for its own administrator. The tag
      # PHP prints must be the tag public/plugin.js reads, the token rule must
      # admit what widgetToken.js issues, the capability must be manage_options
      # and the only gate, the cache opt-out must sit AFTER the decision (before
      # it, the whole site quietly stops being cacheable), a fresh install must
      # print nothing, and the loader must mount one dock even on a site that
      # still has the old hand-pasted theme snippet.
      - name: Dock rules
        run: node scripts/verify-dock.mjs

      # The plugin package: the published SHA-256 has to describe the bytes that
      # are actually served, and packing the same source twice has to produce the
      # same bytes. `zip -rq` stamped each file's mtime into the archive, so every
      # rebuild republished a new hash for identical code — and a site holding the
      # previous hash in its one-hour cache had its update refused, with WordPress
      # "Check again" saying the same thing. That is how valiantmusic.com.au
      # became unable to update at all.
      - name: Plugin pack determinism
        run: node scripts/verify-plugin-pack.mjs

      # What the plugin installs, deleting it removes. `uninstall.php` dropped two
      # options and left five (SEO templates, fix history, pairing record, traffic
      # toggle) until 2026-10-08, so a delete-then-reinstall inherited the old
      # site's settings. The guard reads the option constants out of the plugin's
      # own source, so a new store that nobody adds to uninstall.php fails here.
      - name: Plugin uninstall completeness
        run: node scripts/verify-plugin-uninstall.mjs

      # The guard on the script that holds production DB credentials. A guard
      # that lets a DROP through is worse than no script at all, because the
      # operator stops checking by hand — so the refusal rules are asserted,
      # not assumed. No database needed; the runner itself is never invoked.
      - name: Production migration guard
        run: node scripts/verify-prod-sql.mjs

      # The billing promise "hard stop before overspend" depends on a post-call
      # true-up never taking a balance below zero. Production had an account at
      # -3.7712 credits, so the invariant is asserted directly — a 41k-case
      # sweep plus the wiring that uses it. No database needed.
      - name: Billing clamp (no negative balances)
        run: node scripts/verify-billing-clamp.mjs

      # A call that names no AI role silently takes default_model @ default_temperature —
      # which was a reasoning model whose thinking is billed against max_tokens. This
      # asserts the small hot-path calls stay role-scoped, and that the reasoning-role
      # budgets can actually finish.
      - name: AI roles and budgets
        run: node scripts/verify-ai-roles.mjs

      # The reviewer is 30.6% of AI spend (1,254 calls, 26,138 avg input tokens) because
      # it was handed the Coder's whole scoped context to review at most 3 files. This
      # asserts the reviewer-specific block (rules, bounded tree, schema only when
      # relevant) and that the reviewer stays directly runnable via review_probe.
      - name: Reviewer context
        run: node scripts/verify-review-context.mjs

      # "Did this change break a file that imports it?" is decidable by a script that already
      # exists (lib/importGraph.js). H1 is the incident where leaving it to judgement failed.
      - name: Caller-break gate
        run: node scripts/verify-caller-check.mjs

      # A partial artifact save returned { saved, files, artifacts } with the per-asset
      # failures dropped, so a distro release whose image failed read as "Build complete"
      # and handed the user a README with no image. This asserts the pure outcome AND that
      # both the handler and the CompilePanel keep the failures (no database needed).
      - name: Compile-artifact save is honest about partials
        run: node scripts/verify-compile-artifacts.mjs

      # The save of a real macOS build is ~217 MB, downloaded and re-uploaded. It ran inside
      # one HTTP request, so Cloudflare's ~100s proxy read timeout cut it before the browser's
      # own 210s timeout could fire — and a build that had SUCCEEDED was reported as failed,
      # with "tap RECOMPILE" on an app that already existed. This asserts the save is a
      # background job with a polled status that survives a reload, that it stays streamed and
      # resumable, and that a save failure is never a build failure.
      - name: The artifact save runs in the background and never reads as a failed build
        run: node scripts/verify-artifact-save-background.mjs

      - name: An uploaded cabinet reaches the build, and only from our own storage
        run: node scripts/verify-cabinet-upload.mjs

      # A macOS app compiled on macos-latest is Apple-silicon-only, and an Intel Mac answers
      # "not supported on this Mac" — Rob, holding a disk image Morpheus had just built him.
      # This asserts the Python path builds on both runners, that each disk image is named for
      # the Mac it opens on (and that the glob and the verify step agree with that name), and
      # that a project's own .dmg is never nested inside ours.
      - name: macOS builds cover both Macs, and say which is which
        run: node scripts/verify-mac-app-arch.mjs

      # A compiled app is handed to someone who did not build it, and every answer they need — which
      # download is theirs, how to get past Gatekeeper, where the menu bar went — was somewhere other
      # than the download. This asserts the manual exists for every target, says only what Morpheus
      # has read, travels INSIDE the disk image and beside it as its own download, and that a
      # project's README cannot end the heredoc it is written in.
      - name: The user manual travels with the build
        run: node scripts/verify-user-manual.mjs

      # A Prisma call naming a column that does not exist fails at runtime, and esbuild, lint
      # and the import guards are all blind to it.
      - name: Prisma field gate
        run: node scripts/verify-prisma-fields.mjs

      # morpheus.nz served a 1.5 KB React shell with no description, no structured data
      # and no robots.txt, so crawlers could not tell what the product was. This asserts
      # the machine-readable surface exists, is generated from the capabilities JSON, and
      # is NOT text hidden from users — hidden-from-users text is cloaking.
      - name: SEO / machine-readable surface
        run: node scripts/verify-seo-static.mjs

      # Pure function, no database needed — asserts the CORS policy never
      # reflects an arbitrary origin while also allowing credentials.
      - name: CORS origin policy
        run: node scripts/verify-cors.mjs

      # Enforced memory: asserts the docs still agree with the code — skill
      # frontmatter, bootstrap-SQL/schema parity, referenced paths, and
      # "unbuilt" claims about files that actually exist.
      - name: Docs still match the code
        run: node scripts/verify-context.mjs

      # The engine policy has to be ENFORCED, not just declared. allowForce and
      # allowDirectToMain sat on the scoped policies for a week while nothing
      # read them — pushSelfDevToGithub honoured body.force regardless — because
      # a field that is declared and unread fails no test and looks correct in
      # review. This asserts the pure decision AND the wiring (the source half
      # checks the policy gate precedes the verify gate it guards). No database,
      # no install: enginePolicy.js imports nothing.
      - name: Engine policy is enforced
        run: node scripts/verify-push-policy.mjs

      # Search Console puts real numbers in front of someone who will act on
      # them, so the rules are asserted rather than eyeballed: every figure is
      # Google's for the account's own property and the payload has no field for
      # an estimate, "low CTR" is judged against the site's OWN median at that
      # position rather than an industry table, and an aggregate position is
      # impression-weighted. It also asserts the OAuth return path cannot be an
      # open redirect. Both imported modules are pure, so this needs no install.
      - name: Search Console rules
        run: node scripts/verify-search-console.mjs

      # A health screen is believed, so its rules are asserted rather than
      # eyeballed: no score, WordPress's verdicts never wearing Morpheus's badge,
      # "nothing to update" carrying the age of the claim, no fix offered on a
      # site whose files cannot be written, and an old plugin named rather than
      # surfaced as WordPress's raw error. Pure module — no install.
      - name: Site health rules
        run: node scripts/verify-site-health.mjs

      # CLEAN MY SITE removes files from someone's shop, so its rules are asserted
      # as behaviour rather than eyeballed: the safe set is exactly the site's own
      # `auto` entries (a modified core file can never enter it), no "cleaned" is
      # ever shown without naming the backup that is the undo, what a capped scan
      # skipped is part of the answer, and the app's action name is checked against
      # the plugin's own switch — a rename there is a health scan where a clean one
      # was asked for, which reads as "nothing found". Pure module — no install.
      - name: Clean-my-site rules
        run: node scripts/verify-clean-site.mjs

      # The code that may touch live sites unattended. Asserted before the
      # ability exists: scanning never implies applying, a major core update is
      # never automatic (even if smuggled into the policy), a monthly job stays
      # on its day and exists in February, a run missed while the server was down
      # happens exactly once, and the report never claims work it did not do.
      - name: Site maintenance policy rules
        run: node scripts/verify-site-maintenance.mjs

      # What makes a merge verified at all: the named gates must have RUN, not
      # merely have failed to fail. A green deploy preview with no CI run behind
      # it reads as "passing" to the merge engine — which is how #258 and #259
      # nearly merged with nothing having checked them (hazard H17). Pure module.
      - name: Merge gate rules
        run: node scripts/verify-merge-gates.mjs

      # The fact generator. It exits non-zero if its own extraction breaks —
      # e.g. a refactor moves what it parses — so a silently-wrong report can
      # never be the thing you rely on.
      - name: Context extraction is intact
        run: node scripts/context.mjs > /dev/null

      # Catches a syntax error in any server source. The server tree is ESM
      # ("type": "module"), and server/package-lock.json is intentionally
      # untracked (hazard H4), so this must not require an install.
      #
      # NOTE: `node --check` validates SYNTAX only — it never resolves an import
      # specifier. A wrong relative path is syntactically perfect and passes
      # here, which is exactly how H12 (the 2026-09-19 API outage) got through.
      # The next step is what actually catches that.
      - name: Syntax-check server sources
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! node --check "$f"; then
              echo "::error file=$f::syntax check failed"
              fail=1
            fi
          done < <(find server/src server/scripts -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null)
          echo "checked $count server source file(s)"
          exit $fail

      # Resolves every relative import in the server tree, with exact case.
      # The missing gate behind H12: the step above only parses files, so a
      # mis-relative specifier (`./queue.js` from src/lib/, meaning
      # src/lib/queue.js) is syntactically valid, lint-clean, and kills the
      # container at module load — which is what served "no healthy upstream"
      # for the whole API on 2026-09-19. Case matters too: macOS resolves
      # case-insensitively, the Alpine container does not.
      - name: Server imports resolve
        run: node scripts/verify-server-imports.mjs

      # The operator credential's own guard: it pins the allow-list, proves the
      # escape hatches (force / directToMain / acknowledgeDrift / scopePolicy)
      # are stripped, checks the constant-time compare, and fails if a token
      # value has been committed. A credential that drives production deserves
      # a check that fails when someone widens it by accident.
      - name: Operator drive is scoped and leak-free
        run: node scripts/verify-operator-drive.mjs

      # /proving-ground is an admin-only test surface, so "not customer facing"
      # is a property that decays the moment someone links it. This asserts the
      # route stays inside the adminOnly group, that nothing outside the page
      # names it, and that its card registry and the files on disk agree in
      # BOTH directions — a card that vanishes silently is the exact failure the
      # page exists to catch.
      - name: Proving ground is admin-only and unreferenced
        run: node scripts/verify-proving-ground.mjs

      # A self-dev turn must report its own memory, and must report it to STDOUT:
      # on 2026-09-24 one took the production container down with no error
      # anywhere, and the reading that answers "where did the peak come from" is
      # worthless if it is sent to a response stream that dies with the request.
      - name: The pipeline reports its own memory
        run: node scripts/verify-stage-observability.mjs

      # SYNC FROM GITHUB used to destroy un-pushed work — demonstrated, not
      # theorised: the drift guard refused a stale push, advised a sync, and the
      # sync deleted the change it told the operator to re-apply. This asserts
      # the rule that protects it, AND that a normal catch-up is still allowed.
      - name: Sync cannot silently destroy un-pushed work
        run: node scripts/verify-sync-safety.mjs

      # The platform reported an ESTIMATE from a static rate table as "cost", and
      # measured it ran about 2x the real bill. This asserts the rules that turn
      # two provider balance readings into the real number, that a top-up is not
      # mistaken for a refund, and that the wording never calls the estimate a
      # cost.
      - name: Provider spend is measured, not modelled
        run: node scripts/verify-provider-spend.mjs

      # Two admin docs claimed to be "Generated live from the source code" while
      # rendering hand-written literals describing the pre-rewrite Base44 stack.
      # A document that confidently describes deleted software is worse than none,
      # and the disclaimer is a sentence somebody will tidy away.
      - name: Stale documents declare themselves
        run: node scripts/verify-doc-honesty.mjs

      # The run record: which stages are recorded, how an HTTP status becomes a
      # stage status, that a detail note stays a note, that the migration is
      # additive and idempotent (it ships ahead of an applier that has never
      # run), and that the dispatcher records in a `finally` so a stage that
      # throws still leaves a row.
      - name: Self-dev run record is honest
        run: node scripts/verify-selfdev-runs.mjs

      # Prisma only fails at runtime, on the request that reaches it, so a file can
      # name a delegate that does not exist and stay green through lint, build, every
      # other guard and the render check. Self-dev shipped exactly that on
      # 2026-09-24 (`prisma.selfDevRun.count()` against a raw-SQL table) and the
      # endpoint 500'd on every call.
      - name: Every prisma delegate is a model that exists
        run: node scripts/verify-prisma-models.mjs

      # (The "plan is checked against what already exists" step was removed with the
      # pre-flight itself on 2026-09-25 — it named nothing in 8/8 measured runs at two
      # models while the coder reused the right module unaided 8/8. See the note left
      # where the pre-flight used to be in chatWithMorpheus.js.)

      # verifyProject returned ok:true, errorCount:0, checkedFiles:0 for a 37-file
      # Python desktop app — it reads only JS/TS, so every pass inside it had
      # nothing to look at. "Nothing failed" is not "nothing to check", and every
      # non-JS compile target sits in that position.
      - name: A verifier that examined nothing does not report ok
        run: node scripts/verify-verifier-coverage.mjs
