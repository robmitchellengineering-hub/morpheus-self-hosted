# CI for morpheus-self-hosted.
#
# WHY THIS EXISTS
#
# Until now the only check on a pull request was a Netlify deploy preview — which
# builds the frontend and nothing else. That gap has real consequences:
#
#   * `npm run lint` was RED on main and nobody noticed, because nothing ran it.
#     It broke the verify step AGENTS.md requires and the ship SOP in
#     .dsh/skills/morpheus-dev-protocol.
#   * Self-dev's PRs auto-squash-merge once checks pass (server/src/lib/engine/
#     merge.js). "Checks" meant a deploy preview, so a green preview was the only
#     gate before production.
#
# Deliberately dependency-light: the guards job installs nothing, so it is fast
# and cannot be broken by a flaky registry.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `prebuild` runs scripts/sync-capabilities.mjs, which rewrites this file
      # (KNOWN-HAZARDS.md H3). A build that dirties it is normal; the warning is
      # here so a change that *commits* it gets noticed.
      - name: Note generated-file churn (H3)
        run: |
          if ! git diff --quiet -- src/MORPHEUS_DESIGN_PLAN.md; then
            echo "::warning file=src/MORPHEUS_DESIGN_PLAN.md::npm run build rewrote this file (hazard H3) — do not commit it unless the change is specifically about it."
          fi

  guards:
    name: guards (no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # META-CHECK, deliberately first: every script below must be loadable
      # WITHOUT an install. verify-billing-clamp.mjs was added here importing
      # through billing.js → db.js → @prisma/client, which passed locally and
      # turned this whole job red (H12's module-load class, one level subtler —
      # every relative import resolved; only a package import failed). This
      # walks the job's own scripts and fails on any reachable package import,
      # so a broken guard is diagnosed before the others run and mask it.
      - name: Guards are install-free
        run: node scripts/verify-guards-no-install.mjs

      # The H9 drift guard's runtime verification — real assertions against the
      # module, not a syntax check. server/src/lib/selfDevDrift.js is pure, so
      # this needs no dependencies.
      - name: Self-dev drift guard (H9)
        run: node scripts/verify-drift.mjs

      # Pure function, no database needed — asserts the brain-dump classifier
      # splits a dictated multi-thought dump into separately-filed items and
      # never loses what was said when the model summarises or drops an item.
      - name: Brain-dump classifier
        run: node scripts/verify-dump-classify.mjs

      # The proactive-insight opt-out gate, plus the cross-boundary contract
      # that the widget it keys off still exists in the frontend registry with
      # the copy that makes the control discoverable.
      - name: Proactive-insight opt-out
        run: node scripts/verify-insight-optout.mjs

      # The rules that decide what AI-written SEO is allowed to write onto a
      # live site (length, no fabricated facts, no script), plus the
      # cross-language contract between the JS payload and the WordPress
      # plugin's own PHP input map — a rename on either side is a silent no-op
      # at runtime, since the plugin ignores keys it does not know.
      - name: SEO generation rules + plugin contract
        run: node scripts/verify-seo.mjs

      # The WordPress pairing flow: the code is a credential that mints the
      # shared secret, so the security rules (constant-time compare, expiry,
      # single use, failure and rate limits, no look-alike characters) and the
      # JS/PHP wire contract are asserted rather than assumed — a rename on
      # either side is a silent 403 at runtime.
      - name: WordPress pairing rules + plugin contract
        run: node scripts/verify-pairing.mjs

      # Putting a live site into a repo: the export endpoint reads files off
      # someone's server, so "inside the active theme only, text only, capped,
      # and everything skipped is reported" is asserted against the source, as
      # is the JS/PHP contract for it.
      - name: Site working copy rules + plugin contract
        run: node scripts/verify-working-copy.mjs

      # Keyword research: the autocomplete payload and competitor-page parsing,
      # plus the rule that makes the feature honest — every keyword carries the
      # signal that produced it, and the response has nowhere to put a search
      # volume or difficulty score (a model asked for one invents it).
      - name: Keyword research rules
        run: node scripts/verify-keywords.mjs

      # The photo widget on Alice Stats: what counts as a Drive folder, what
      # counts as an acceptable photo, and above all that a 403 (this connection
      # cannot write there) never reads like a 404 (no such folder) — plus the
      # promises on screen: the photo goes to the user's own Drive, the camera
      # opens on a phone, and no Prisma column was added for what an existing
      # JSON column already holds.
      - name: Photo widget rules
        run: node scripts/verify-photo-drive.mjs

      # Traffic (IndexNow): the pure payload/batching/ledger decisions, the rule
      # that a 2xx means "submitted" and never "indexed", and the contracts across
      # the boundary — the action list against the plugin's switch, the widget
      # scope against what the tab actually invokes, the caps on both sides, and
      # the tab being mounted by BOTH surfaces. Each of those otherwise fails at
      # runtime on a customer's site as a silent 400 or a missing tab.
      - name: Traffic rules
        run: node scripts/verify-traffic.mjs

      # The guard on the script that holds production DB credentials. A guard
      # that lets a DROP through is worse than no script at all, because the
      # operator stops checking by hand — so the refusal rules are asserted,
      # not assumed. No database needed; the runner itself is never invoked.
      - name: Production migration guard
        run: node scripts/verify-prod-sql.mjs

      # The billing promise "hard stop before overspend" depends on a post-call
      # true-up never taking a balance below zero. Production had an account at
      # -3.7712 credits, so the invariant is asserted directly — a 41k-case
      # sweep plus the wiring that uses it. No database needed.
      - name: Billing clamp (no negative balances)
        run: node scripts/verify-billing-clamp.mjs

      # Pure function, no database needed — asserts the CORS policy never
      # reflects an arbitrary origin while also allowing credentials.
      - name: CORS origin policy
        run: node scripts/verify-cors.mjs

      # Enforced memory: asserts the docs still agree with the code — skill
      # frontmatter, bootstrap-SQL/schema parity, referenced paths, and
      # "unbuilt" claims about files that actually exist.
      - name: Docs still match the code
        run: node scripts/verify-context.mjs

      # The engine policy has to be ENFORCED, not just declared. allowForce and
      # allowDirectToMain sat on the scoped policies for a week while nothing
      # read them — pushSelfDevToGithub honoured body.force regardless — because
      # a field that is declared and unread fails no test and looks correct in
      # review. This asserts the pure decision AND the wiring (the source half
      # checks the policy gate precedes the verify gate it guards). No database,
      # no install: enginePolicy.js imports nothing.
      - name: Engine policy is enforced
        run: node scripts/verify-push-policy.mjs

      # Search Console puts real numbers in front of someone who will act on
      # them, so the rules are asserted rather than eyeballed: every figure is
      # Google's for the account's own property and the payload has no field for
      # an estimate, "low CTR" is judged against the site's OWN median at that
      # position rather than an industry table, and an aggregate position is
      # impression-weighted. It also asserts the OAuth return path cannot be an
      # open redirect. Both imported modules are pure, so this needs no install.
      - name: Search Console rules
        run: node scripts/verify-search-console.mjs

      # A health screen is believed, so its rules are asserted rather than
      # eyeballed: no score, WordPress's verdicts never wearing Morpheus's badge,
      # "nothing to update" carrying the age of the claim, no fix offered on a
      # site whose files cannot be written, and an old plugin named rather than
      # surfaced as WordPress's raw error. Pure module — no install.
      - name: Site health rules
        run: node scripts/verify-site-health.mjs

      # The code that may touch live sites unattended. Asserted before the
      # ability exists: scanning never implies applying, a major core update is
      # never automatic (even if smuggled into the policy), a monthly job stays
      # on its day and exists in February, a run missed while the server was down
      # happens exactly once, and the report never claims work it did not do.
      - name: Site maintenance policy rules
        run: node scripts/verify-site-maintenance.mjs

      # What makes a merge verified at all: the named gates must have RUN, not
      # merely have failed to fail. A green deploy preview with no CI run behind
      # it reads as "passing" to the merge engine — which is how #258 and #259
      # nearly merged with nothing having checked them (hazard H17). Pure module.
      - name: Merge gate rules
        run: node scripts/verify-merge-gates.mjs

      # The fact generator. It exits non-zero if its own extraction breaks —
      # e.g. a refactor moves what it parses — so a silently-wrong report can
      # never be the thing you rely on.
      - name: Context extraction is intact
        run: node scripts/context.mjs > /dev/null

      # Catches a syntax error in any server source. The server tree is ESM
      # ("type": "module"), and server/package-lock.json is intentionally
      # untracked (hazard H4), so this must not require an install.
      #
      # NOTE: `node --check` validates SYNTAX only — it never resolves an import
      # specifier. A wrong relative path is syntactically perfect and passes
      # here, which is exactly how H12 (the 2026-09-19 API outage) got through.
      # The next step is what actually catches that.
      - name: Syntax-check server sources
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! node --check "$f"; then
              echo "::error file=$f::syntax check failed"
              fail=1
            fi
          done < <(find server/src server/scripts -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null)
          echo "checked $count server source file(s)"
          exit $fail

      # Resolves every relative import in the server tree, with exact case.
      # The missing gate behind H12: the step above only parses files, so a
      # mis-relative specifier (`./queue.js` from src/lib/, meaning
      # src/lib/queue.js) is syntactically valid, lint-clean, and kills the
      # container at module load — which is what served "no healthy upstream"
      # for the whole API on 2026-09-19. Case matters too: macOS resolves
      # case-insensitively, the Alpine container does not.
      - name: Server imports resolve
        run: node scripts/verify-server-imports.mjs
