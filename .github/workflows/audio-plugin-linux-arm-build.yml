# Build the audio-plugin-linux-arm target for real, on a runner that is an ARM64 Linux machine.
#
# WHY THIS EXISTS
#
# This route's entire claim is "the plugin this produces runs on a Raspberry Pi", and the only way to know
# that is to compile it on an aarch64 Linux machine and read the architecture back out of the artefact. A
# plugin built for the wrong instruction set is the quietest failure in this whole target family: the file
# exists, the name says linux-arm, the folder is in the right place, and the host that loads it simply never
# sees it. Nothing else in CI can catch that — the required checks prove the GUARDS, on a runner with no
# aarch64 CPU, and the plugin itself is only built when a user compiles, in their own repo.
#
# This materialises what the target generates and runs the target's OWN steps, so a command changed in the
# target changes here too. It does not re-type a single one.
#
# MANUAL ONLY, DELIBERATELY. Every dispatch spends Actions minutes, and this one downloads the VST3 SDK and
# builds four third-party projects before it gets to ours. It is dispatched by hand when the target or the
# shared plugin project changes, from the Actions tab or
#
#   gh workflow run audio-plugin-linux-arm-build.yml --ref main
#
# ⚠️ THE PLUGIN PROJECT IS SHARED WITH THE macOS AND WINDOWS ROUTES (lib/audioPluginProject.js and
# lib/audioPluginTemplate.js), so a change to either one must be dispatched on ALL THREE —
# `.github/workflows/audio-plugin-macos-build.yml`, `.github/workflows/audio-plugin-windows-build.yml` and
# this one. A single green run proves one route, and the other two were built from code that no longer
# exists. This is the one place a compile target's evidence goes stale silently.
name: Audio plugin build (Linux ARM)

on:
  workflow_dispatch:
    inputs:
      # ⭐ EMPTY BY DEFAULT, AND THAT IS THE POINT: a normal run is a VERIFICATION and publishes nothing.
      # Set it to a tag to also publish these artifacts as a durable, public download — the demo build
      # linked from the site. Tag `plugin-demo` is the one the site points at.
      publish_tag:
        description: 'Publish the built plugins as a public release under this tag (leave empty to just verify)'
        required: false
        default: ''

permissions:
  # `read` for every step that builds and verifies; `write` is needed by the publish step below, because
  # creating a release is a write to this repository. It is granted at the workflow level because GitHub
  # does not allow a step to raise its own permissions — and the publish step is skipped unless a tag is
  # given, so a verification run still only reads.
  contents: write

jobs:
  audio-plugin:
    name: audio-plugin (Linux ARM, all three formats)
    # A standard GitHub-hosted ARM64 runner (aarch64), available to private repositories and billed against
    # the plan's included minutes. NATIVE, not cross-compiled: cross-building clap-wrapper would mean
    # cross-building the VST3 SDK and finding aarch64 X11/ALSA development packages, which is a great deal
    # of machinery to avoid one runner label — and it would prove a toolchain nobody ships with.
    runs-on: ubuntu-24.04-arm
    # Configure downloads the VST3 SDK, RtAudio and RtMidi; the build then compiles all of it plus three
    # formats of our plugin on two vCPUs. Well inside this, but a hang must not sit on a runner for an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything else — the apt packages, the wrapper clone, configure, the three builds, the ELF and
      # AArch64 assertions and the packaging — is the target's own step list, executed by this script. See
      # its header for why it does not re-type a single command.
      - name: Build and verify every format the target emits (no model — the gain stage)
        run: node scripts/audio-plugin-linux-arm-runner-build.mjs
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-linux-arm-build

      # The models are MIT and are FETCHED rather than committed — the same two the measurement workflow uses,
      # and the same engine builds them. Nothing third-party is stored in this repository.
      - name: Fetch the example models (MIT)
        run: |
          mkdir -p .cache/models
          # ⚠️ THE PINNED COMMIT, NOT `main`. The engine is pinned to NAMCORE_REF in namPlugin.js, and fetching
          # models from a moving branch means a model can arrive that the pinned engine cannot load — which is
          # the same class of failure as the one just fixed from the other side, where our generator refused a
          # format the engine supported. The model and the engine that plays it come from one commit.
          base=https://raw.githubusercontent.com/sdatkinson/NeuralAmpModelerCore/0b3d3c9/example_models
          curl -sSfL -o .cache/models/wavenet_a1_standard.nam "$base/wavenet_a1_standard.nam"
          # NAM A2's own file: a SlimmableContainer, several submodels of one amp at different sizes. It is the
          # format the device tier is being decided on, and until #543 our generator refused it.
          curl -sSfL -o .cache/models/A2.nam "$base/A2.nam"
          curl -sSfL -o .cache/models/slimmable_container.nam "$base/slimmable_container.nam"
          curl -sSfL -o .cache/models/slimmable_wavenet.nam "$base/slimmable_wavenet.nam"
          curl -sSfL -o .cache/models/lstm.nam "$base/lstm.nam"
          curl -sSfL -o .cache/models/linear_1.nam \
            https://raw.githubusercontent.com/sdatkinson/neural-amp-modeler/main/tests/resources/models/identity/linear_1.nam
          ls -la .cache/models

      # ⭐ THE PROOF THIS WORKFLOW EXISTS FOR. A project carrying a `.nam` fetches NeuralAmpModelerCore,
      # compiles it into the plugin and embeds the model — on aarch64, which is the only place the Pi claim can
      # be tested. It is a SECOND, separate build directory so the no-model artifact above keeps its evidence:
      # the same target, the same runner, two different plugin shapes.
      #
      # `--render-check` is the part that says the plugin PLAYS the model rather than merely carrying it: the
      # same dry signal through the plugin's own CLAP entry point and through NAMCore's `render`, built from
      # the same checkout, compared sample by sample. The model here is the real WAVENET, not the identity —
      # an identity model would null against the dry signal perfectly and prove nothing about the engine. And
      # `--expect-model-effect-db -20` fails the run if the reference render is itself almost identical to the
      # dry signal, which is what a vacuous comparison looks like.
      - name: Build with a real NAM model, then prove the plugin plays it
        run: |
          node scripts/audio-plugin-linux-arm-runner-build.mjs \
            --model .cache/models/wavenet_a1_standard.nam \
            --render-check \
            --expect-model-effect-db -20
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-linux-arm-nam-build

      # ⭐ THE ARCHITECTURE TABLE, ON THE CPU THE DEVICE USES. The build above proves the plugin plays ONE
      # model; this says what every model COSTS, which is the other half of the device decision and the half
      # nothing had measured. It times `nam::get_dsp`'s process() directly — the same call the plugin's CLAP
      # process() makes, same engine, same pin, same 64-frame blocks — so it is one engine compile and then a
      # row per model, rather than a whole plugin build each. `--slim` walks a container's size dial, which is
      # the feature that makes NAM A2 interesting on a Pi at all.
      - name: Model throughput on a Pi-class CPU, across architectures
        run: |
          git clone --quiet --depth 1 https://github.com/sdatkinson/NeuralAmpModelerCore.git "$RUNNER_TEMP/bench-namcore"
          git -C "$RUNNER_TEMP/bench-namcore" submodule update --init --depth 1
          node scripts/audio-model-bench.mjs \
            --namcore "$RUNNER_TEMP/bench-namcore" \
            --models .cache/models/wavenet_a1_standard.nam,.cache/models/A2.nam,.cache/models/slimmable_container.nam,.cache/models/slimmable_wavenet.nam,.cache/models/lstm.nam \
            --slim 0.0,1.0

      # ⭐ AND THE PLUGIN ITSELF PLAYING A CONTAINER. The bench above measures the ENGINE, and the plugin is a
      # separate claim: it embeds the .nam as bytes and hands them to nam::get_dsp, so a SlimmableContainer
      # reaches the engine through our generator. Nothing had proved that path end to end — and the default
      # submodel is the LARGEST, so this also fixes which end of A2's dial "no choice made" means.
      - name: Build with NAM A2, then prove the plugin plays the container
        run: |
          node scripts/audio-plugin-linux-arm-runner-build.mjs \
            --model .cache/models/A2.nam \
            --render-check \
            --expect-model-effect-db -20
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-linux-arm-a2-build

      # ⭐ THE CHAIN ON A PI-CLASS CPU. The gate, the tone stack and the speaker have their own designs and were
      # measured against them on x86-64; this renders them through the plugin's own CLAP entry point on aarch64.
      # The impulse response is SYNTHETIC and generated here, because every real cabinet IR belongs to somebody.
      - name: Make a synthetic cabinet (deterministic, nothing third-party)
        run: node scripts/make-test-cab.mjs "${{ runner.temp }}/test-cab.wav"

      - name: Build the amp chain, then prove the gate, the tone stack and the cabinet
        run: |
          node scripts/audio-plugin-linux-arm-runner-build.mjs \
            --chain \
            --cab "${{ runner.temp }}/test-cab.wav" \
            --chain-check
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-linux-arm-chain-build

      # `if-no-files-found: error` is the second half of the check: if any of the three archives is missing,
      # the run fails here rather than passing with two of three artifacts.
      - name: Keep the packaged plugins, so the run can be inspected rather than believed
        uses: actions/upload-artifact@v4
        with:
          name: audio-plugin-linux-arm
          path: |
            ${{ runner.temp }}/audio-plugin-linux-arm-build/build/assets/*.zip
            ${{ runner.temp }}/audio-plugin-linux-arm-nam-build/build/assets/*.zip
            ${{ runner.temp }}/audio-plugin-linux-arm-build/BUILD-PROOF.txt
            ${{ runner.temp }}/audio-plugin-linux-arm-nam-build/BUILD-PROOF.txt
            ${{ runner.temp }}/audio-plugin-linux-arm-chain-build/BUILD-PROOF.txt
          if-no-files-found: error
          retention-days: 7

      # ⭐ AND NOW THE DOWNLOAD ITSELF. The upload above is a 7-day artifact for inspecting a run; it is
      # not a download anyone can be pointed at. This republishes the SAME verified bytes as a release,
      # which is durable, is a real URL, and carries its own notice and proof.
      #
      # It publishes the MODEL build — a real amp capture through our chain. NOT the chain build, whose
      # cabinet is a synthetic impulse response generated by the build: a demo that sounds like a filter
      # rather than a speaker is worse than no demo at all.
      #
      # `fail_on_unmatched_files` is deliberate. A release missing one of the formats would be a download
      # page promising a VST3 that is not in the archive, which is the exact failure the verify steps
      # above exist to prevent — so the publish fails rather than shipping a partial set.
      - name: Publish the demo download
        if: inputs.publish_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: 'Morpheus audio plugin — Linux AArch64 demo'
          body: |
            A prebuilt Morpheus audio plugin for Linux AArch64, so you can hear what the plugin route
            produces before compiling your own. **Read PLUGIN-DEMO-NOTICE.txt first** — it carries the
            terms, the model's provenance and the third-party licences.

            This is the amplifier stage: a neural amp model from NeuralAmpModelerCore, with an input trim,
            a noise gate and a three-band tone stack. Unsigned. Not the product — what Morpheus makes for
            you is a plugin built in your own repository around your own model and cabinet.
          files: |
            ${{ runner.temp }}/audio-plugin-linux-arm-nam-build/build/assets/*.zip
            ${{ runner.temp }}/audio-plugin-linux-arm-nam-build/BUILD-PROOF.txt
            docs/PLUGIN-DEMO-NOTICE.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
