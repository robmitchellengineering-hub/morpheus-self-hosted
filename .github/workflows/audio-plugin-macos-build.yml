# Build the audio-plugin target for real, on a runner that has Xcode.
#
# WHY THIS EXISTS
#
# `audio-plugin` emits four formats from one CLAP source, and one of them cannot be built on the machine
# this repo is developed on: the standalone's macOS shell is compiled by `ibtool`, which needs full Xcode,
# and that machine has only the Command Line Tools. Three formats were built and verified there; the
# standalone has never been built anywhere, so it is "expected to work" and nothing more.
#
# The rest of CI does not cover this. The required checks prove the GUARDS — that the target generates the
# right project and renders the right workflow — and they run on ubuntu with no compiler, no Xcode and no
# network build. The plugin itself is only built when a user compiles, in their own repo. That is a real
# hole in the evidence, and this workflow is the cheapest thing that closes it: it materialises what the
# target generates and runs the target's OWN steps, so a command changed in the target changes here too.
#
# MANUAL ONLY, DELIBERATELY. macOS runner minutes bill at 10x, so this must never run on a pull request or
# a push: it is dispatched by hand when the target changes, from the Actions tab or
#
#   gh workflow run audio-plugin-macos-build.yml --ref main
#
# and it uploads the packaged plugins, so a run can be inspected (and a real plugin loaded in a DAW)
# rather than taken on trust.
name: Audio plugin build (macOS)

on:
  workflow_dispatch:
    inputs:
      # ⭐ EMPTY BY DEFAULT, AND THAT IS THE POINT: a normal run is a VERIFICATION and publishes nothing.
      # Set it to a tag to also publish these artifacts as a durable, public download — the demo build
      # linked from the site. Tag `plugin-demo` is the one the site points at.
      publish_tag:
        description: 'Publish the built plugins as a public release under this tag (leave empty to just verify)'
        required: false
        default: ''

permissions:
  # `read` for every step that builds and verifies; `write` is needed by the publish step below, because
  # creating a release is a write to this repository. It is granted at the workflow level because GitHub
  # does not allow a step to raise its own permissions — and the publish step is skipped unless a tag is
  # given, so a verification run still only reads.
  contents: write

jobs:
  audio-plugin:
    name: audio-plugin (macOS, all four formats)
    runs-on: macos-latest
    # The configure step downloads the VST3 SDK, AudioUnitSDK, RtAudio and RtMidi (~102s measured), then
    # builds four formats. Well inside this, but a hang must not sit on a runner for an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything else — the wrapper clone, configure, the four builds, the binary-in-bundle check and the
      # packaging — is the target's own step list, executed by this script. See its header for why it does
      # not re-type a single command.
      - name: Build and verify every format the target emits
        run: node scripts/audio-plugin-macos-runner-build.mjs
      # The model is MIT and is FETCHED rather than committed, from the SAME pinned commit as the engine that
      # will play it — a model from a moving branch could arrive in a shape the pinned engine cannot load.
      - name: Fetch the example model (MIT)
        # ⚠️ `shell` goes BEFORE `run`, not between `run: |` and its body. Putting it after turned the
        # block body into the value of `shell`, and the runner refused the whole step with "Invalid shell
        # option" — a YAML shape error that reads like a shell problem.
        shell: bash
        run: |
          mkdir -p .cache/models
          curl -sSfL -o .cache/models/wavenet_a1_standard.nam \
            https://raw.githubusercontent.com/sdatkinson/NeuralAmpModelerCore/0b3d3c9/example_models/wavenet_a1_standard.nam
          ls -la .cache/models

      # ⭐ WHY THIS RIG NOW BUILDS TWICE, AND WHY THE DEMO WAS WRONG WITHOUT IT. The first build has no model
      # and is the plain gain stage — that is a supported state and the run above still proves it. But the
      # DEMO DOWNLOAD was pointed at that build, so `plugin-macos-*.zip` was a stereo gain stage published
      # under a description calling it "a neural amp model with an input trim, a gate and a three-band tone
      # stack". The build's own proof said otherwise in as many words — "(none: this is the gain plugin)" and
      # one parameter, `Gain`, where the amp has six — and nobody read it. This second build IS the amp, and
      # it is the one published.
      - name: Build it again WITH the model — this is the one people download
        run: |
          node scripts/audio-plugin-macos-runner-build.mjs --model .cache/models/wavenet_a1_standard.nam
        env:
          AUDIO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/audio-plugin-nam-build


      # `if-no-files-found: error` is the second half of the check: if the standalone's zip is missing, the
      # run fails here rather than passing with three of four artifacts.
      #
      # ⚠️ TWO ARTIFACTS, NOT ONE, AND THE SECOND ONE IS THE POINT. This uploaded only the FIRST build — the
      # plain gain stage — so a no-tag verification run could not hand anybody something worth opening, and the
      # only way to get the amp build into a person's hands was to republish the PUBLIC `plugin-demo` release.
      # That is backwards: the build this workflow calls "the one people download" should be the one a run
      # offers, and publishing should be a separate decision rather than the only way to look at it.
      - name: Keep the gain-stage build, so every supported shape a run proves can be inspected
        uses: actions/upload-artifact@v4
        with:
          name: audio-plugin-macos
          path: ${{ runner.temp }}/audio-plugin-build/build/assets/*.zip
          if-no-files-found: error
          retention-days: 7

      # ⭐ THE AMP BUILD — nine blocks, a model, and the panel's own switch rows. This is what a person
      # installs to hear and see the plugin, and it is the same bytes the publish step below would release.
      - name: Keep the AMP build too — the one a person actually opens
        uses: actions/upload-artifact@v4
        with:
          name: audio-plugin-macos-amp
          path: ${{ runner.temp }}/audio-plugin-nam-build/build/assets/*.zip
          if-no-files-found: error
          retention-days: 7

      # ⭐ AND NOW THE DOWNLOAD ITSELF. The upload above is a 7-day artifact for inspecting a run; it is
      # not a download anyone can be pointed at. This republishes the SAME verified bytes as a release,
      # which is durable, is a real URL, and carries its own notice and proof.
      #
      # It publishes the MODEL build — a real amp capture through our chain. NOT the chain build, whose
      # cabinet is a synthetic impulse response generated by the build: a demo that sounds like a filter
      # rather than a speaker is worse than no demo at all.
      #
      # `fail_on_unmatched_files` is deliberate. A release missing one of the formats would be a download
      # page promising a VST3 that is not in the archive, which is the exact failure the verify steps
      # above exist to prevent — so the publish fails rather than shipping a partial set.
      # ⚠️ THE PROOF IS RENAMED BEFORE IT IS PUBLISHED, AND THIS IS NOT COSMETIC. Every rig writes a file
      # called BUILD-PROOF.txt and they all publish to the SAME release, so whichever platform ran last
      # overwrote the others — the release briefly carried the Windows proof beside the Linux binaries,
      # which is a download page whose evidence describes a different machine than the file next to it.
      # The zips never collided because they are already named per platform; the proof was not.
      - name: Name the proof for the machine that wrote it
        if: inputs.publish_tag != ''
        run: cp "${{ runner.temp }}/audio-plugin-nam-build/BUILD-PROOF.txt" "${{ runner.temp }}/BUILD-PROOF-macos.txt"

      - name: Publish the demo download
        if: inputs.publish_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: 'Morpheus audio plugin — macOS demo'
          body: |
            A prebuilt Morpheus audio plugin for macOS, so you can hear what the plugin route
            produces before compiling your own. **Read PLUGIN-DEMO-NOTICE.txt first** — it carries the
            terms, the model's provenance and the third-party licences.

            This is the whole rig: a neural amp model from NeuralAmpModelerCore into a drive, a three-band
            tone stack, a delay and a spring reverb — nine blocks in the order a pedalboard would have them.
            ⚠️ **No cabinet impulse response ships with this build.** The cabinet block is in the path and inert,
            because every good impulse response in the wild is either commercial or carries no right to
            redistribute; drop your own `.wav` in and it is live. **It draws its own control panel** — the plugin
            owns the sliders, so the standalone app has knobs rather than an empty window, and a DAW shows them
            instead of its generic parameter list. Every control is in its own units (dB, %, ms).

            ⚠️ **The standalone monitors your audio input** — with a live microphone and the speakers
            up, an amp model in a monitoring host is a feedback loop and it will howl. Use headphones, or a
            DAW (where the host decides monitoring). And it is a captured high-gain amp: with the gate at its
            lowest setting it has a noise floor of its own, so raise GATE to about -40 dB to silence it
            between notes.
          files: |
            ${{ runner.temp }}/audio-plugin-nam-build/build/assets/*.zip
            ${{ runner.temp }}/BUILD-PROOF-macos.txt
            docs/PLUGIN-DEMO-NOTICE.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
