# Served by the frontend Docker image (see Dockerfile). In docker-compose
# this container is named "frontend" and "backend" resolves via the compose
# network's internal DNS. Behind a real load balancer with multiple frontend
# replicas, point that LB's upstream at each replica's :80 and put TLS
# termination in front of it — see SCALING.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running AI/compile-poll requests — see SCALING.md's async
        # job-offload note; raised past nginx's 60s default in the meantime.
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:4500;
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routing (react-router-dom) owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself stays no-cache so
    # deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
