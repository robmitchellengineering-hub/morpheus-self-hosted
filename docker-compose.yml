name: morpheus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: morpheus
      POSTGRES_PASSWORD: morpheus
      POSTGRES_DB: morpheus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morpheus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://morpheus:morpheus@postgres:5432/morpheus?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/app/data/storage # only used when STORAGE_DRIVER=local — irrelevant once you switch to S3
    ports:
      - "4500:4500"
    command: sh -c "npx prisma migrate deploy && node src/index.js"
    restart: unless-stopped

  # Background worker — scales independently of the API servers. A no-op
  # until a queue producer exists (see server/src/queue.js); start it once
  # you've offloaded autonomousBuildStep/getCompileStatus onto the queue.
  worker:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://morpheus:morpheus@postgres:5432/morpheus?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node src/worker.js
    restart: unless-stopped
    profiles: ["worker"] # `docker compose --profile worker up` to include it

  frontend:
    build:
      context: .
    # No runtime env needed — nginx.conf hardcodes proxy_pass to the
    # "backend" service name via Docker's internal DNS.
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
